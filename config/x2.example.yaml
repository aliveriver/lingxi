backend: ros2
robot:
  model: X2 Ultra
  firmware: v1.1.4
  pc1_host: 10.0.1.40
  pc2_host: 10.0.1.41
ros:
  node_name: lingxi_x2_platform
  aimdk_prefix: /agibot/software/common
  camera_streams:
    - rgbd_front_rgb
  state_timeout_s: 0.5
control:
  enabled: false
  authority: upper_body_mc
  publish_rate_hz: 50.0
  max_arm_step_rad: 0.05
  max_hand_step_rad: 0.15
  require_no_competing_publishers: true
  allowed_competing_nodes: []
web:
  host: 127.0.0.1
  port: 8080
