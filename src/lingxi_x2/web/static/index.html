<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lingxi X2 Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Lingxi X2</h1>
      <span id="connection" class="status">Connecting</span>
    </div>
    <nav>
      <button class="tab active" data-view="monitor">Monitor</button>
      <button class="tab" data-view="control">Control</button>
      <button class="tab" data-view="logs">Logs</button>
    </nav>
  </header>
  <main>
    <section id="monitor" class="view active">
      <div class="camera-pane">
        <div class="pane-title">
          <h2>RGB-D Front</h2>
          <span id="frame-meta">--</span>
        </div>
        <img id="camera" alt="RGB-D front camera stream">
      </div>
      <aside>
        <section class="panel">
          <h2>Capabilities</h2>
          <div id="capabilities" class="capabilities"></div>
        </section>
        <section class="panel">
          <h2>Robot State</h2>
          <dl id="summary"></dl>
        </section>
      </aside>
      <section class="joint-band">
        <div class="pane-title"><h2>Arm Joints</h2><span>rad</span></div>
        <div id="arm-joints" class="joint-grid"></div>
      </section>
      <section class="hand-band">
        <div class="hand-column"><h2>Left OmniHand</h2><div id="left-hand" class="joint-grid compact"></div></div>
        <div class="hand-column"><h2>Right OmniHand</h2><div id="right-hand" class="joint-grid compact"></div></div>
      </section>
    </section>
    <section id="control" class="view">
      <div class="control-layout">
        <section class="control-surface">
          <div class="pane-title"><h2>Arm Target</h2><span>14 DOF</span></div>
          <div id="arm-controls" class="slider-list"></div>
          <div class="command-row"><input id="arm-duration" type="number" min="0.1" max="30" step="0.1" value="2"><button id="send-arm">Send arm</button></div>
        </section>
        <section class="control-surface">
          <div class="pane-title"><h2>Hand Target</h2><select id="hand-side"><option value="left">Left</option><option value="right">Right</option></select></div>
          <div id="hand-controls" class="slider-list"></div>
          <div class="command-row"><input id="hand-duration" type="number" min="0.1" max="30" step="0.1" value="1"><button id="send-hand">Send hand</button></div>
        </section>
      </div>
      <div class="confirmation"><label><input id="armed" type="checkbox"> Physical workspace clear, operator at E-stop</label></div>
    </section>
    <section id="logs" class="view"><pre id="log"></pre></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
